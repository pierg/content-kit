<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard</title>
<link rel="stylesheet" href="/shell/lib.css">
<style>
/* The dashboard: the record as a status board. What is true now — the current phase, the open
   questions and their kill criteria, the experiment pipeline, findings by status, the claims
   they support, and the recent decisions. Generated from content/ladder.json by `ckit nav`;
   nothing here is authored. Sibling to the chronicle (the same record as a timeline). */

.db-sub { color: var(--ink-2); }
.db-tally { display: flex; flex-wrap: wrap; gap: 6px 8px; margin: 12px 0 4px; }
.db-tally .n { font: 700 12px ui-monospace, Menlo, monospace; padding: 3px 10px; border-radius: 999px;
               border: 1.5px solid var(--baseline); background: var(--surface-1); color: var(--ink-2); }
.db-tally .n b { color: var(--ink-1); }

/* "Right now" banner */
.db-now { background: var(--surface-1); border: 1px solid var(--ring); border-radius: 12px;
          padding: 14px 18px; margin: 18px 0 8px; }
.db-now-label { font: 700 10.5px ui-monospace, Menlo, monospace; letter-spacing: 0.06em;
                text-transform: uppercase; color: var(--judge); }
.db-now h2 { margin: 4px 0 6px; font-size: 18px; padding: 0; border: 0; }
.db-now p { margin: 4px 0 0; color: var(--ink-2); font-size: 14px; line-height: 1.55; }
.db-now .more { font: 12.5px ui-monospace, Menlo, monospace; margin-top: 8px; }

/* Panel grid */
.db-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr));
           gap: 16px; margin: 16px 0; align-items: start; }
.db-panel { border: 1px solid var(--grid); border-radius: 12px; background: var(--surface-1);
            padding: 4px 16px 12px; }
.db-panel > h2 { font-size: 14px; letter-spacing: 0.02em; margin: 12px 0 4px; padding: 0 0 8px;
                 border-bottom: 1.5px solid var(--baseline); display: flex; align-items: baseline;
                 gap: 8px; }
.db-panel > h2 .c { font: 500 11.5px ui-monospace, Menlo, monospace; color: var(--ink-3); margin-left: auto; }
.db-panel > h2 a.more { font: 500 11.5px ui-monospace, Menlo, monospace; }
.db-empty { color: var(--ink-3); font-size: 13px; padding: 10px 0; }

.db-row { padding: 8px 0; border-top: 1px dashed var(--grid); font-size: 13.5px; line-height: 1.45; }
.db-row:first-of-type { border-top: 0; }
.db-row .top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.db-row .t { font-weight: 600; }
.db-row .t a { color: var(--ink-1); }
.db-row .t a:hover { color: var(--gen); text-decoration: none; }
.db-row .meta { color: var(--ink-2); font-size: 12.5px; margin: 3px 0 0; }
.db-row time { font: 11.5px ui-monospace, Menlo, monospace; color: var(--ink-3); flex: 0 0 auto; }
.db-sub-h { font: 700 10.5px ui-monospace, Menlo, monospace; text-transform: uppercase;
            letter-spacing: 0.05em; color: var(--ink-3); margin: 12px 0 2px; }

/* Status chips */
.st { display: inline-block; font: 700 10px ui-monospace, Menlo, monospace; text-transform: uppercase;
      letter-spacing: 0.04em; padding: 1px 7px; border-radius: 999px; border: 1px solid; vertical-align: 1px; }
.st.good, .st.banked, .st.answered, .st.kept { color: var(--kept-text); border-color: var(--kept);
      background: color-mix(in srgb, var(--kept) 8%, transparent); }
.st.open, .st.provisional, .st.live { color: var(--judge); border-color: var(--judge);
      background: color-mix(in srgb, var(--judge) 8%, transparent); }
.st.locked { color: var(--cert); border-color: var(--cert); }
.st.draft { color: var(--ink-3); border-color: var(--baseline); }
.st.killed, .st.retracted, .st.voided { color: var(--leak); border-color: var(--leak);
      background: color-mix(in srgb, var(--leak) 8%, transparent); }
.st.parked, .st.superseded, .st.moved, .st.none { color: var(--ink-3); border-color: var(--baseline); }

/* Kind chips (decisions) — matches the chronicle */
.k { display: inline-block; font: 700 10px ui-monospace, Menlo, monospace; text-transform: uppercase;
     letter-spacing: 0.05em; padding: 1px 6px; border-radius: 3px; border: 1px solid; vertical-align: 1px; }
.k.pivot { color: var(--world); border-color: var(--world); background: color-mix(in srgb, var(--world) 6%, transparent); }
.k.kill { color: var(--leak); border-color: var(--leak); background: color-mix(in srgb, var(--leak) 8%, transparent); }
.k.decision { color: var(--judge); border-color: var(--judge); background: color-mix(in srgb, var(--judge) 6%, transparent); }

.db-explore { margin: 26px 0 8px; padding-top: 14px; border-top: 1.5px solid var(--baseline);
              display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: baseline; }
.db-explore .lbl { font: 700 10.5px ui-monospace, Menlo, monospace; text-transform: uppercase;
                   letter-spacing: 0.05em; color: var(--ink-3); margin-right: 4px; }
.db-explore a { border: 1.5px solid var(--baseline); border-radius: 999px; padding: 3px 12px;
                font-size: 12.5px; text-decoration: none; color: var(--ink-2); }
.db-explore a:hover { border-color: var(--judge); color: var(--judge); }
.db-meta { color: var(--ink-3); font-size: 12.5px; margin: 6px 2px; }
</style>
<script src="/shell/lib.js" defer></script>
</head>
<body class="hb">
<main>

<h1>Dashboard</h1>
<p class="sub db-sub">What is true now — the open questions and their kill criteria, the experiments, the findings and the claims they support, and the recent decisions. Generated from the record; nothing here is written by hand. For how it got here, see the <a href="/shell/chronicle.html">Chronicle &rarr;</a></p>

<div class="db-tally" id="tally"></div>
<section id="now" hidden></section>
<div class="db-meta" id="meta">Loading…</div>
<div class="db-grid" id="grid"></div>
<div class="db-explore" id="explore" hidden></div>

<script>
(function () {
  "use strict";

  function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function day(d) { return String(d || "").slice(0, 10); }
  function stClass(s) { return String(s || "none").toLowerCase().replace(/[^a-z]+/g, ""); }
  function stChip(s) { return s ? '<span class="st ' + esc(stClass(s)) + '">' + esc(s) + "</span>" : ""; }

  function panel(title, count, moreHref, moreLabel, bodyHtml) {
    return '<section class="db-panel"><h2>' + esc(title) +
      (count != null ? ' <span class="c">' + esc(String(count)) + "</span>" : "") +
      (moreHref ? ' <a class="more" href="' + esc(moreHref) + '">' + esc(moreLabel || "all →") + "</a>" : "") +
      "</h2>" + bodyHtml + "</section>";
  }
  function empty(msg) { return '<p class="db-empty">' + esc(msg) + "</p>"; }

  function renderNow(now) {
    if (!now) return;
    var el = document.getElementById("now");
    el.hidden = false;
    el.innerHTML = '<div class="db-now"><div class="db-now-label">Right now</div><h2>' + esc(now.title) + "</h2>" +
      (now.summary ? "<p>" + esc(now.summary) + "</p>" : "") +
      (now.href ? '<div class="more"><a href="' + esc(now.href) + '">Read ' + esc(now.path || "the state") + " →</a></div>" : "") +
      "</div>";
  }

  function renderTally(d) {
    var c = d.counts || {};
    var bits = [];
    function add(label, n) { if (n) bits.push('<span class="n"><b>' + n + "</b> " + esc(label) + "</span>"); }
    add("findings", (d.findings || []).length);
    add("experiments", (d.experiments || []).length);
    add("open questions", (d.questions || []).filter(function (q) { return stClass(q.status) === "open"; }).length);
    add("claims", (d.claims || []).length);
    document.getElementById("tally").innerHTML = bits.join("");
  }

  function questionsPanel(qs) {
    if (!qs.length) return "";
    var body = qs.map(function (q) {
      return '<div class="db-row"><div class="top"><span class="t"><a href="' + esc(q.href) + '">' +
        esc(q.id) + " · " + esc(q.title) + "</a></span>" + stChip(q.status) + "</div>" +
        (q.kill ? '<p class="meta"><b>Kill:</b> ' + esc(q.kill) + "</p>" : "") + "</div>";
    }).join("");
    return panel("Questions", qs.length, "/shell/record.html?p=QUESTIONS.md", "QUESTIONS.md →", body);
  }

  function experimentsPanel(xs) {
    if (!xs.length) return "";
    var order = ["LIVE", "LOCKED", "DRAFT"];
    var groups = {};
    xs.forEach(function (x) { var s = x.status || "—"; (groups[s] = groups[s] || []).push(x); });
    var keys = Object.keys(groups).sort(function (a, b) {
      var ia = order.indexOf(a), ib = order.indexOf(b);
      return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.localeCompare(b);
    });
    var body = keys.map(function (s) {
      return '<div class="db-sub-h">' + esc(s) + " · " + groups[s].length + "</div>" +
        groups[s].map(function (x) {
          var nf = (x.findings || []).length;
          return '<div class="db-row"><div class="top">' + stChip(x.status) +
            '<span class="t"><a href="' + esc(x.href) + '">' + esc(x.title) + "</a></span>" +
            (x.locked ? "<time>" + esc(day(x.locked)) + "</time>" : "") + "</div>" +
            (x.question ? '<p class="meta">' + esc(x.question).slice(0, 150) + "</p>" : "") +
            (nf ? '<p class="meta">' + x.findings.map(function (f) { return '<a href="' + esc(f.href) + '">' + esc(f.id) + "</a>"; }).join(", ") + "</p>" : "") +
            "</div>";
        }).join("");
    }).join("");
    return panel("Experiments", xs.length, "/shell/chronicle.html?view=experiments", "timeline →", body);
  }

  function findingsPanel(fs) {
    if (!fs.length) return "";
    var groups = {};
    fs.forEach(function (f) { var s = f.status || "—"; (groups[s] = groups[s] || []).push(f); });
    var body = Object.keys(groups).sort().map(function (s) {
      return '<div class="db-sub-h">' + esc(s) + " · " + groups[s].length + "</div>" +
        groups[s].map(function (f) {
          return '<div class="db-row"><div class="top"><span class="t"><a href="' + esc(f.href) + '">' +
            esc(f.id) + "</a> " + esc(f.title) + "</span></div></div>";
        }).join("");
    }).join("");
    return panel("Findings", fs.length, "/shell/record.html?p=record/findings.md", "findings.md →", body);
  }

  function claimsPanel(cs) {
    if (!cs.length) return "";
    var body = cs.map(function (c) {
      var rests = (c.rests_on || []).length ? '<p class="meta">rests on ' + c.rests_on.map(esc).join(", ") + "</p>" : "";
      return '<div class="db-row"><div class="top"><span class="t"><a href="' + esc(c.href) + '">' +
        esc(c.id) + "</a> " + esc(c.title) + "</span></div>" + rests + "</div>";
    }).join("");
    return panel("Claims", cs.length, "/shell/record.html?p=record/claims.md", "claims.md →", body);
  }

  function decisionsPanel(ds) {
    if (!ds.length) return "";
    var body = ds.map(function (e) {
      return '<div class="db-row"><div class="top"><time>' + esc(day(e.date)) + "</time>" +
        '<span class="k ' + esc(stClass(e.kind)) + '">' + esc(e.kind) + "</span>" +
        '<span class="t"><a href="' + esc(e.href) + '">' + esc(e.title) + "</a></span></div>" +
        (e.summary ? '<p class="meta">' + esc(e.summary).slice(0, 180) + "</p>" : "") + "</div>";
    }).join("");
    return panel("Recent decisions", ds.length, "/shell/chronicle.html", "chronicle →", body);
  }

  function renderExplore(catalog) {
    var el = document.getElementById("explore");
    var links = ['<span class="lbl">Explore</span>',
                 '<a href="/shell/search.html">Search</a>',
                 '<a href="/shell/chronicle.html">Chronicle (timeline)</a>'];
    // Deep-link straight to each populated library group; the sidebar carries the full browse.
    [["Papers", "papers"], ["Books", "books"], ["Projects", "projects"],
     ["Entries", "entries"], ["Concepts", "concepts"], ["Notes", "notes"]].forEach(function (g) {
      var items = (catalog && catalog[g[1]]) || [];
      if (items.length) links.push('<a href="' + esc(items[0].href) + '">' + esc(g[0]) + " (" + items.length + ")</a>");
    });
    el.innerHTML = links.join("");
    el.hidden = false;
  }

  document.addEventListener("DOMContentLoaded", function () {
    Promise.all([
      fetch("/content/ladder.json", { credentials: "same-origin", cache: "no-store" })
        .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); }),
      fetch("/content/catalog.json", { credentials: "same-origin", cache: "no-store" })
        .then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; }),
    ]).then(function (pair) {
      var d = pair[0], catalog = pair[1];
      renderTally(d);
      renderNow(d.now);
      var panels = [
        questionsPanel(d.questions || []),
        experimentsPanel(d.experiments || []),
        findingsPanel(d.findings || []),
        claimsPanel(d.claims || []),
        decisionsPanel(d.decisions || []),
      ].filter(Boolean);
      document.getElementById("grid").innerHTML = panels.length ? panels.join("") :
        empty("No ladder data yet — declare a record (and a ladder extractor) in lab.json and run `ckit lint`.");
      document.getElementById("meta").textContent =
        (d.findings || []).length + " findings · " + (d.experiments || []).length + " experiments · " +
        (d.questions || []).length + " questions · " + (d.claims || []).length + " claims";
      renderExplore(catalog);
    }).catch(function (ex) {
      document.getElementById("meta").textContent =
        "No dashboard yet — set \"home\": \"dashboard\" in lab.json and run `ckit lint`. (" + ex.message + ")";
    });
  });
})();
</script>

</main>
</body>
</html>
