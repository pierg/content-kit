<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Browse</title>
<link rel="stylesheet" href="/shell/lib.css">
<style>
/* Browse and search: every page of the library (and of every index kit.json `indices` merges in),
   narrowed by words, kind, topic and tag. The filters live in the URL (?q= &kind= &topic= &tag=),
   so a breadcrumb, a tag chip or a topic card can link straight to a view of the library.
   Generated from /content/search-index.json and /content/catalog.json; nothing here is authored. */
.br-bar { position: relative; max-width: 46rem; margin: 6px 0 16px; }
.br-bar .hb-ico { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--ink-3); width: 18px; height: 18px; }
.br-input { width: 100%; box-sizing: border-box; padding: 13px 16px 13px 42px; font: 16px/1.4 var(--font-sans);
            background: var(--surface-1); color: var(--ink-1); border: 1px solid var(--baseline); border-radius: 12px; }
.br-input:focus { outline: 2px solid color-mix(in srgb, var(--accent) 45%, transparent); border-color: var(--accent); }
.br-facets { display: grid; gap: 10px; margin: 0 0 22px; }
.br-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.br-row .br-label { font: 650 10.5px/1.2 var(--font-sans); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3);
                    width: 4.5rem; flex: none; }
.fchip { font: 500 12.5px/1 var(--font-sans); padding: 6px 11px; border-radius: 999px; border: 1px solid var(--grid);
         background: var(--surface-1); color: var(--ink-2); cursor: pointer; }
.fchip:hover { border-color: var(--baseline); color: var(--ink-1); }
.fchip.on { border-color: var(--accent); color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, var(--surface-1)); }
.fchip .n { color: var(--ink-3); margin-left: 4px; font-variant-numeric: tabular-nums; }
.fchip.more { border-style: dashed; }
.br-meta { font: 13px/1.4 var(--font-sans); color: var(--ink-3); margin: 0 0 12px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.br-meta button { font: 500 12.5px/1 var(--font-sans); background: none; border: 0; color: var(--link); cursor: pointer; padding: 0; }
.hits { list-style: none; padding: 0; margin: 0; border-top: 1px solid var(--grid); }
.hit  { padding: 16px 2px 16px; border-bottom: 1px solid var(--grid); }
.hit .top { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.hit .title { font: 650 16.5px/1.35 var(--font-sans); letter-spacing: -0.01em; }
.hit .title a { color: var(--ink-1); text-decoration: none; }
.hit .title a:hover { color: var(--link); }
.hit .where { font: 12.5px/1.3 var(--font-sans); color: var(--ink-3); }
.hit .origin { font: 600 11px/1 var(--font-sans); color: var(--ink-2); border: 1px dashed var(--baseline); border-radius: 4px; padding: 2px 6px; }
.hit .sub  { font: 15px/1.55 var(--font-serif); color: var(--ink-2); margin: 6px 0 0; max-width: 48rem; }
.hit .snip { font: 13.5px/1.55 var(--font-sans); color: var(--ink-3); margin: 5px 0 0; max-width: 48rem; }
.hit mark { background: color-mix(in srgb, var(--amber) 28%, transparent); color: inherit; border-radius: 2px; padding: 0 1px; }
.hit .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
.hit .tags a { font: 500 11.5px/1 var(--font-sans); color: var(--ink-3); background: var(--surface-2); border: 1px solid var(--grid);
               border-radius: 999px; padding: 4px 8px; text-decoration: none; }
.hit .tags a:hover { color: var(--ink-1); }
.br-section { font: 650 10.5px/1.2 var(--font-sans); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); margin: 30px 0 4px; }
.empty { color: var(--ink-3); padding: 40px 0; text-align: center; font: 14px var(--font-sans); }
</style>
<script src="/shell/lib.js" defer></script>
</head>
<body class="hb" data-hb-app>
<main>

<h1>Browse</h1>
<p class="sub">Every page in the library — by words, kind, topic and tag. Titles, opening lines, headings, definitions and tags are searched here from the generated search index; press <span class="hb-kbd">/</span> anywhere for the quick palette.</p>

<div class="br-bar">
  <svg class="hb-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
  <input id="q" type="search" class="br-input" placeholder="Search the library…" autofocus autocomplete="off" spellcheck="false" aria-label="Search the library">
</div>
<div class="br-facets" id="facets"></div>
<div class="br-meta" id="meta">Loading the index…</div>
<ul class="hits" id="hits" aria-live="polite"></ul>
<div id="fulltext"></div>

<script>
(function () {
  "use strict";
  /* The site's base path ("/" under ckit serve, "/<repo>/" on an exported project site). */
  var BASE = location.pathname.replace(/shell\/[^\/]*$/, "");
  function u(href) {
    return typeof href === "string" && href.charAt(0) === "/" && href.charAt(1) !== "/" ? BASE + href.slice(1) : href;
  }
  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function titleCase(s) { return String(s).replace(/[-_]+/g, " ").replace(/\b\w/g, function (c) { return c.toUpperCase(); }); }
  function clean(sub) { return window.hbCleanSub ? window.hbCleanSub(sub) : String(sub || ""); }
  function words(q) { return q.toLowerCase().split(/\s+/).filter(function (w) { return w.length > 1; }); }
  function highlight(text, q) {  /* marks on the raw text, then escapes every piece (lib.js) */
    if (window.hbHighlight) return window.hbHighlight(text, q);
    return esc(text);
  }
  function fmtDate(iso) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || "");
    if (!m) return "";
    try { return new Date(+m[1], +m[2] - 1, +m[3]).toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" }); }
    catch (e) { return iso; }
  }

  var params = new URLSearchParams(location.search);
  function list(name) { return (params.get(name) || "").split(",").map(function (x) { return x.trim(); }).filter(Boolean); }
  var state = { q: params.get("q") || "", kinds: new Set(list("kind")), topics: new Set(list("topic")),
                tags: new Set(list("tag")), allTags: false };
  var idx = [], KINDS = [], TOPICS = [], TAGS = [], labels = Object.create(null), dates = Object.create(null);

  function sync() {
    var p = new URLSearchParams();
    if (state.q.trim()) p.set("q", state.q.trim());
    if (state.kinds.size) p.set("kind", Array.from(state.kinds).join(","));
    if (state.topics.size) p.set("topic", Array.from(state.topics).join(","));
    if (state.tags.size) p.set("tag", Array.from(state.tags).join(","));
    var qs = p.toString();
    history.replaceState(null, "", location.pathname + (qs ? "?" + qs : ""));
  }

  function matches(r) {
    if (state.kinds.size && !state.kinds.has(r.kind)) return false;
    if (state.topics.size && !state.topics.has(r.topic || "")) return false;
    if (state.tags.size) {
      var tg = r.tags || [];
      var all = true;
      state.tags.forEach(function (t) { if (tg.indexOf(t) === -1) all = false; });
      if (!all) return false;
    }
    return true;
  }

  function score(r, q) {
    if (!q) return 1;
    if (window.hbScore) return window.hbScore(r, q, String(labels[r.topic] || r.topic || ""));
    var t = (r.title + " " + (r.sub || "")).toLowerCase();
    return q.toLowerCase().split(/\s+/).every(function (w) { return t.indexOf(w) !== -1; }) ? 1 : 0;
  }

  function snippet(r, q) {
    var pool = [r.defn, (r.headings || []).join(" · ")].filter(Boolean);
    var ws = words(q);
    for (var i = 0; i < pool.length; i++) {
      var t = pool[i], lo = t.toLowerCase();
      for (var j = 0; j < ws.length; j++) {
        var ix = lo.indexOf(ws[j]);
        if (ix < 0) continue;
        var start = Math.max(0, ix - 50), end = Math.min(t.length, ix + ws[j].length + 120);
        return (start > 0 ? "…" : "") + t.slice(start, end) + (end < t.length ? "…" : "");
      }
    }
    return "";
  }

  function chip(kind, value, label, n, on) {
    return '<button type="button" class="fchip' + (on ? " on" : "") + '" data-f="' + kind + '" data-v="' + esc(value) + '">' +
      esc(label) + (n != null ? '<span class="n">' + n + "</span>" : "") + "</button>";
  }

  function renderFacets() {
    var pool = idx.filter(function (r) { return !r.origin; });
    var rows = [];
    rows.push('<div class="br-row"><span class="br-label">Kind</span>' + KINDS.map(function (k) {
      var n = idx.filter(function (r) { return r.kind === k; }).length;
      return n ? chip("kind", k, k, n, state.kinds.has(k)) : "";
    }).join("") + "</div>");
    if (TOPICS.length) rows.push('<div class="br-row"><span class="br-label">Topic</span>' + TOPICS.map(function (t) {
      var n = pool.filter(function (r) { return r.topic === t; }).length;
      return chip("topic", t, labels[t] || titleCase(t), n, state.topics.has(t));
    }).join("") + "</div>");
    if (TAGS.length) {
      var shown = state.allTags ? TAGS : TAGS.slice(0, 18);
      state.tags.forEach(function (t) {
        if (!shown.some(function (x) { return (x.name || x) === t; })) shown = shown.concat([{ name: t, n: null }]);
      });
      rows.push('<div class="br-row"><span class="br-label">Tag</span>' + shown.map(function (t) {
        return chip("tag", t.name || t, "#" + (t.name || t), t.n, state.tags.has(t.name || t));
      }).join("") + (TAGS.length > 18 && !state.allTags ? '<button type="button" class="fchip more" data-f="more">+' + (TAGS.length - 18) + " more</button>" : "") + "</div>");
    }
    document.getElementById("facets").innerHTML = rows.join("");
  }

  function render() {
    var q = state.q.trim();
    var hits = idx.filter(matches)
      .map(function (r) { return { r: r, s: score(r, q) }; })
      .filter(function (x) { return x.s > 0; })
      .sort(function (a, b) {
        if (q) return b.s - a.s;
        var da = dates[a.r.href] || "", db = dates[b.r.href] || "";
        return da < db ? 1 : da > db ? -1 : (a.r.title || "").localeCompare(b.r.title || "");
      });
    var filtered = state.kinds.size || state.topics.size || state.tags.size;
    document.getElementById("meta").innerHTML =
      "<span>" + (q ? hits.length + " page" + (hits.length === 1 ? "" : "s") + " match “" + esc(q) + "”"
                    : hits.length + " page" + (hits.length === 1 ? "" : "s") + (filtered ? "" : ", newest first")) + "</span>" +
      (q || filtered ? '<button type="button" data-f="clear">Clear</button>' : "");
    var hitsEl = document.getElementById("hits");
    if (!hits.length) {
      hitsEl.innerHTML = '<li class="empty">Nothing matches — try fewer words, or clear a filter.</li>';
    } else {
      hitsEl.innerHTML = hits.slice(0, 80).map(function (h) {
        var r = h.r, snip = q ? snippet(r, q) : "";
        var where = [];
        if (r.topic) where.push(esc(labels[r.topic] || titleCase(r.topic)));
        if (dates[r.href]) where.push("updated " + esc(fmtDate(dates[r.href])));
        return '<li class="hit"><div class="top"><span class="hb-kind hb-kind-' + esc(r.kind) + '">' + esc(r.kind) + "</span>" +
          '<span class="title"><a href="' + esc(u(r.href)) + '">' + highlight(r.title || r.href, q) + "</a></span>" +
          (r.origin ? '<span class="origin">' + esc(r.origin) + "</span>" : "") +
          (where.length ? '<span class="where">· ' + where.join(" · ") + "</span>" : "") + "</div>" +
          (r.sub ? '<div class="sub">' + highlight(clean(r.sub), q) + "</div>" : "") +
          (snip ? '<div class="snip">' + highlight(snip, q) + "</div>" : "") +
          (r.tags && r.tags.length ? '<div class="tags">' + r.tags.map(function (t) {
            return '<a href="' + esc(u("/shell/search.html?tag=" + encodeURIComponent(t))) + '" data-tag="' + esc(t) + '">#' + esc(t) + "</a>";
          }).join("") + "</div>" : "") + "</li>";
      }).join("");
    }
    fulltext(q, hits);
  }

  var ftSeq = 0;
  function fulltext(q, hits) {
    var box = document.getElementById("fulltext");
    var seq = ++ftSeq;
    if (q.length < 3 || !window.hbPagefind) { box.innerHTML = ""; return; }
    window.hbPagefind().then(function (pf) {
      if (!pf || seq !== ftSeq) return null;
      return pf.debouncedSearch ? pf.debouncedSearch(q, {}, 200) : pf.search(q);
    }).then(function (s) {
      if (!s || seq !== ftSeq) return null;
      return Promise.all(s.results.slice(0, 12).map(function (x) { return x.data(); }));
    }).then(function (docs) {
      if (!docs || seq !== ftSeq) return;
      var shown = Object.create(null);
      hits.forEach(function (h) { shown[u(h.r.href)] = 1; });
      docs = docs.filter(function (d) { return !shown[d.url.replace(/index\.html$/, "")]; });
      box.innerHTML = docs.length ? '<div class="br-section">Also in the text</div><ul class="hits">' + docs.map(function (d) {
        return '<li class="hit"><div class="top"><span class="title"><a href="' + esc(d.url) + '">' + esc((d.meta && d.meta.title) || d.url) +
          '</a></span></div><div class="snip">' + d.excerpt + "</div></li>";
      }).join("") + "</ul>" : "";
    }).catch(function () {});
  }

  function getJson(url) {
    return fetch(u(url), { credentials: "same-origin" }).then(function (r) {
      if (!r.ok) throw new Error(url + " " + r.status);
      return r.json();
    });
  }

  document.addEventListener("DOMContentLoaded", function () {
    var input = document.getElementById("q");
    input.value = state.q;
    input.addEventListener("input", function () { state.q = input.value; sync(); render(); });
    document.addEventListener("click", function (e) {
      var b = e.target.closest("[data-f]");
      if (b) {
        var f = b.dataset.f, v = b.dataset.v;
        if (f === "clear") { state.q = ""; input.value = ""; state.kinds.clear(); state.topics.clear(); state.tags.clear(); }
        else if (f === "more") state.allTags = true;
        else {
          var set = f === "kind" ? state.kinds : f === "topic" ? state.topics : state.tags;
          if (set.has(v)) set.delete(v); else set.add(v);
        }
        sync(); renderFacets(); render();
        return;
      }
      var t = e.target.closest("a[data-tag]");
      if (t && !e.metaKey && !e.ctrlKey) {
        e.preventDefault();
        state.tags.add(t.dataset.tag);
        sync(); renderFacets(); render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    });
    /* the repo's own index, then every extra index kit.json `indices` declares (a personal library's
       federated catalog of sibling repos, say) — merged; one that fails to load is skipped */
    getJson("/content/catalog.json").catch(function () { return null; }).then(function (catalog) {
      var extra = ((catalog && catalog.indices) || []).map(function (href) {
        return getJson(href).catch(function () { return []; });
      });
      return Promise.all([getJson("/content/search-index.json")].concat(extra)).then(function (lists) {
        /* an index is a list of records, or an object carrying them under "records" */
        idx = [].concat.apply([], lists.map(function (l) {
          return Array.isArray(l) ? l : (l && Array.isArray(l.records) ? l.records : []);
        }));
        var got = (catalog && catalog.topics) || {};
        Object.keys(got).forEach(function (k) { labels[k] = got[k]; });
        ((catalog && catalog.groups) || []).forEach(function (g) {
          if (KINDS.indexOf(g.kind) === -1) KINDS.push(g.kind);
          (catalog[g.key] || []).forEach(function (it) { if (it.updated) dates[it.href] = it.updated; });
        });
        idx.forEach(function (r) { if (KINDS.indexOf(r.kind) === -1) KINDS.push(r.kind); });
        KINDS = KINDS.filter(function (k) { return k !== "page"; }).concat(["page"]);
        var seenT = Object.create(null);
        Object.keys(labels).forEach(function (t) { seenT[t] = 1; TOPICS.push(t); });
        idx.forEach(function (r) { if (r.topic && !r.origin && !seenT[r.topic]) { seenT[r.topic] = 1; TOPICS.push(r.topic); } });
        var counts = Object.create(null);
        idx.forEach(function (r) { if (!r.origin) (r.tags || []).forEach(function (t) { counts[t] = (counts[t] || 0) + 1; }); });
        TAGS = Object.keys(counts).sort(function (a, b) { return counts[b] - counts[a] || a.localeCompare(b); })
          .map(function (t) { return { name: t, n: counts[t] }; });
        renderFacets();
        render();
      });
    }).catch(function () {
      document.getElementById("meta").textContent = "The search index could not be loaded.";
    });
  });
})();
</script>

</main>
</body>
</html>
