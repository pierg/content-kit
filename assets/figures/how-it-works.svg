<svg width="800" height="300" viewBox="0 0 800 300" role="img" xmlns="http://www.w3.org/2000/svg">
  <style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#1d1b17}.t2{fill:#57524a}.t3{fill:#8b857a}</style>
<rect width="800" height="300" rx="14" fill="#faf9f6"/>
<defs>
    <marker id="hw-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" style="fill: #57524a"/>
    </marker>
  </defs>
  <rect x="20" y="20" width="160" height="56" rx="10" style="fill: #ffffff; stroke: #57524a; stroke-width: 1.5"/>
  <text x="100" y="44" text-anchor="middle" style="font-size: 13px; font-weight: 700">the kit</text>
  <text x="100" y="63" text-anchor="middle" class="t2" style="font-size: 11px">rules, in the repository</text>
  <path d="M100 76 L100 128" style="stroke: #57524a; stroke-width: 1.5" marker-end="url(#hw-a)"/>
  <text x="108" y="106" class="t3" style="font-size: 11px">guides</text>
  <rect x="20" y="130" width="160" height="64" rx="10" style="fill: #ffffff; stroke: #2a78d6; stroke-width: 2"/>
  <text x="100" y="157" text-anchor="middle" style="font-size: 13px; font-weight: 700; fill: #2a78d6">an agent</text>
  <text x="100" y="176" text-anchor="middle" class="t2" style="font-size: 11px">any session, any clone</text>
  <path d="M180 162 L238 162" style="stroke: #57524a; stroke-width: 1.5" marker-end="url(#hw-a)"/>
  <text x="209" y="154" text-anchor="middle" class="t3" style="font-size: 11px">writes</text>
  <rect x="240" y="130" width="150" height="64" rx="10" style="fill: #ffffff; stroke: #57524a; stroke-width: 1.5"/>
  <text x="315" y="157" text-anchor="middle" style="font-size: 13px; font-weight: 700">a page</text>
  <text x="315" y="176" text-anchor="middle" class="t2" style="font-size: 11px">HTML, served as written</text>
  <path d="M450 162 L392 162" style="stroke: #57524a; stroke-width: 1.5" marker-end="url(#hw-a)"/>
  <text x="421" y="154" text-anchor="middle" class="t3" style="font-size: 11px">checks</text>
  <rect x="450" y="130" width="150" height="64" rx="10" style="fill: #ffffff; stroke: #4a3aa7; stroke-width: 2"/>
  <text x="525" y="157" text-anchor="middle" style="font-size: 13px; font-weight: 700; fill: #4a3aa7">the engine</text>
  <text x="525" y="176" text-anchor="middle" class="t2" style="font-size: 11px">ckit, installed once</text>
  <path d="M600 162 L658 162" style="stroke: #57524a; stroke-width: 1.5" marker-end="url(#hw-a)"/>
  <text x="629" y="154" text-anchor="middle" class="t3" style="font-size: 11px">serves</text>
  <rect x="660" y="130" width="120" height="64" rx="10" style="fill: #ffffff; stroke: #eb6834; stroke-width: 2"/>
  <text x="720" y="157" text-anchor="middle" style="font-size: 13px; font-weight: 700; fill: #eb6834">a reader</text>
  <text x="720" y="176" text-anchor="middle" class="t2" style="font-size: 11px">in the browser</text>
  <path d="M720 194 L720 234" style="stroke: #57524a; stroke-width: 1.5" marker-end="url(#hw-a)"/>
  <text x="728" y="219" class="t3" style="font-size: 11px">leaves</text>
  <rect x="620" y="236" width="160" height="56" rx="10" style="fill: #ffffff; stroke: #57524a; stroke-width: 1.5"/>
  <text x="700" y="260" text-anchor="middle" style="font-size: 13px; font-weight: 700">an annotation</text>
  <text x="700" y="279" text-anchor="middle" class="t2" style="font-size: 11px">a file beside the page</text>
  <path d="M100 194 L100 264 L618 264" style="fill: none; stroke: #57524a; stroke-width: 1.5" marker-end="url(#hw-a)"/>
  <text x="360" y="256" text-anchor="middle" class="t3" style="font-size: 11px">answers</text>
