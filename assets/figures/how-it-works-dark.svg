<svg width="800" height="300" viewBox="0 0 800 300" role="img" xmlns="http://www.w3.org/2000/svg">
  <style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#ecebe6}.t2{fill:#b9b4aa}.t3{fill:#8b867c}</style>
<rect width="800" height="300" rx="14" fill="#131312"/>
