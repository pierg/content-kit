  <text x="525" y="176" text-anchor="middle" class="t2" style="font-size: 11px">ckit, installed once</text>
  <path d="M600 162 L658 162" style="stroke: #b9b4aa; stroke-width: 1.5" marker-end="url(#hw-a)"/>
